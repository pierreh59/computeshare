[package]
name = "computeshare-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# LAI-19 : detection materiel
nvml-wrapper = "0.10"
sysinfo = "0.31"

[profile.release]
lto = true
strip = true
