[package]
name = "computeshare-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nvml-wrapper = "0.10"
sysinfo = "0.31"
sha2 = "0.10"
device_query = "2"
# TLS pour parler a la gateway en HTTPS (ureq utilise rustls, pas d'OpenSSL requis).
ureq = "2"

[profile.release]
lto = true
strip = true
