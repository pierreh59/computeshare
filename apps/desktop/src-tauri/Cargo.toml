"[package]\nname = \"computeshare-desktop\"\nversion = \"0.6.1\"\nedition = \"2021\"\n\n[build-dependencies]\ntauri-build = { version = \"2\", features = [] }\n\n[dependencies]\ntauri = { version = \"2\", features = [] }\nserde = { version = \"1\", features = [\"derive\"] }\nserde_json = \"1\"\nnvml-wrapper = \"0.10\"\nsysinfo = \"0.31\"\nsha2 = \"0.10\"\ndevice_query = \"2\"\n# TLS pour parler a la gateway en HTTPS (ureq utilise rustls, pas d'OpenSSL requis).\nureq = \"2\"\n# Repertoire de configuration multi-plateforme (%APPDATA% sous Windows).\ndirs = \"5\"\n# Sprint 16 : demarrage automatique, mises a jour, ouverture de liens.\ntauri-plugin-autostart = \"2\"\ntauri-plugin-updater = \"2\"\ntauri-plugin-process = \"2\"\ntauri-plugin-opener = \"2\"\n\n[profile.release]\nlto = true\nstrip = true\n"