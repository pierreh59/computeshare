name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  orchestrator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.23" }
      - run: cd services/orchestrator && go vet ./... && go test ./... && go build ./...

  # Toutes les migrations, dans l'ordre, sur une base vierge : une virgule
  # orpheline dans une migration casse l'init du volume Postgres en prod
  # (vu en vrai le 4 nov. 2026 avec 006_wallet.sql).
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # Pas d'apt-get ici : le 11 nov. 2026, deux runs CI ont echoue parce
      # que le runner ne resolvait plus les miroirs Ubuntu ("Temporary
      # failure resolving"). On applique les migrations avec le client psql
      # de l'image postgres:16-alpine, deja telechargee pour le service :
      # aucun telechargement externe, immunise contre les pannes apt.
      - name: Appliquer toutes les migrations dans l'ordre
        run: |
          set -e
          for f in db/migrations/*.sql; do
            echo "== $f"
            docker run --rm --network host -e PGPASSWORD=ci \
              -v "$PWD/db:/db:ro" postgres:16-alpine \
              psql -h localhost -U ci -d ci -v ON_ERROR_STOP=1 -f "/db/migrations/${f##*/}"
          done

  # L'app desktop Tauri doit compiler depuis le depot : le code Rust des
  # sprints 1-7 n'avait jamais ete compile hors de la machine de dev, et
  # six erreurs se cachaient dans la version poussee (vu en vrai le 4 nov.).
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: "apps/desktop/src-tauri" }
      - name: cargo check
        run: cargo check
        working-directory: apps/desktop/src-tauri
