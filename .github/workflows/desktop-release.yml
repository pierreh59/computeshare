# Sprint 16 (LAI-62) - Build de l'installateur Windows (NSIS) de l'app
# fournisseur et publication en GitHub Release avec les artefacts de
# mise a jour (latest.json + .sig signes).
#
# Preconditions (une seule fois) :
#   1. Secret TAURI_SIGNING_PRIVATE_KEY : contenu de la cle privee
#      minisign (ou chemin vers le fichier).
#   2. Secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD : mot de passe de la
#      cle (chaine vide si aucun).
# Les deux se posent dans GitHub > Settings > Secrets and variables >
# Actions > New repository secret.
#
# Lancement : onglet Actions > Desktop release > Run workflow.

name: Desktop release

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri"

      - name: Verifier les secrets de signature
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY manquant (GitHub > Settings > Secrets and variables > Actions > New repository secret)"
            exit 1
          fi

      # Tauri telecharge NSIS et nsis_tauri_utils SANS mecanisme de
      # reessai ; le CDN GitHub renvoie parfois des 504 qui font echouer
      # tout le build (vu en vrai le 5 nov. 2026, deux fois). On
      # pre-telecharge avec curl --retry directement dans le cache que
      # tauri-bundler utilise (%LOCALAPPDATA%\tauri\nsis) : s'il y
      # trouve makensis.exe et la dll, il ne telecharge plus rien.
      - name: Pre-telecharger NSIS (contourne les 504 du CDN)
        shell: pwsh
        run: |
          $cache = Join-Path $env:LOCALAPPDATA "tauri\nsis"
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          function Get-File($url, $dest) {
            if (Test-Path $dest) { return $true }
            foreach ($i in 1..6) {
              Write-Host "telechargement $url (essai $i)"
              curl.exe -L --retry 5 --retry-delay 5 --connect-timeout 20 -o "$dest.tmp" $url
              if ($LASTEXITCODE -eq 0 -and (Test-Path "$dest.tmp")) {
                Move-Item -Force "$dest.tmp" $dest
                return $true
              }
              Start-Sleep 10
            }
            return $false
          }
          $zip = Join-Path $cache "nsis-3.13.zip"
          if (-not (Test-Path (Join-Path $cache "nsis-3.13\makensis.exe"))) {
            if (Get-File "https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.13/nsis-3.13.zip" $zip) {
              Expand-Archive -Path $zip -DestinationPath $cache -Force
            }
          }
          Get-File "https://github.com/tauri-apps/nsis-tauri-utils/releases/latest/download/nsis_tauri_utils.dll" (Join-Path $cache "nsis_tauri_utils.dll") | Out-Null
          if (Test-Path (Join-Path $cache "nsis-3.13\makensis.exe")) {
            Write-Host "NSIS pre-telecharge OK"
          } else {
            Write-Host "NSIS absent : tauri tentera son propre telechargement"
          }

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: desktop-v__VERSION__
          releaseName: "ComputeShare Desktop v__VERSION__"
          releaseBody: "Application fournisseur ComputeShare (Windows). Telechargez le fichier -setup.exe, lancez-le, connectez-vous avec votre compte fournisseur."
          releaseDraft: false
          prerelease: false
