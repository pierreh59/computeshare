# Stack de production ComputeShare :
#   caddy (TLS automatique Let's Encrypt) -> orchestrateur -> postgres + nats
#   + service "migrate" qui applique db/migrations/ a chaque demarrage.
#
# Usage (depuis ce dossier, avec un fichier .env a cote) :
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build

services:
  orchestrator:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      PORT: "8081"
      DATABASE_URL: postgres://computeshare:${POSTGRES_PASSWORD}@db:5432/computeshare?sslmode=disable
      ADMIN_KEY: ${ADMIN_KEY}
      NODE_ENROLLMENT_TOKEN: ${NODE_ENROLLMENT_TOKEN}
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Sprint 15d : verification SIRET via l'API INSEE SIRENE.
      # Optionnel : sans ces identifiants, les comptes societe restent
      # "non verifies" (AUCUNE inscription n'est bloquee).
      INSEE_KEY: ${INSEE_KEY:-}
      INSEE_SECRET: ${INSEE_SECRET:-}
      # Sprint 26 : fichiers de resultats rapatries, sur volume dedie
      # pour survivre aux rebuilds du conteneur.
      RESULTS_DIR: /data/results
      # Sprint 27 : assets d'entree des jobs (meme volume /data,
      # deja possede par l'utilisateur app depuis le fix du 7 nov.).
      ASSETS_DIR: /data/assets
      # Sprint 29 : e-mails transactionnels Brevo (verification d'adresse,
      # reinitialisation de mot de passe). BREVO_API_KEY vient du .env ;
      # les autres valeurs ont des defauts cote orchestrateur.
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # Sprint 32 : destinataire du bilan hebdo (vide : pas d'envoi auto).
      REPORT_EMAIL: ${REPORT_EMAIL:-}
    volumes:
      - resultsdata:/data
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: computeshare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: computeshare
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U computeshare"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Applique les migrations non deja passees, puis se termine.
  # Un registre (migrations_applied) trace ce qui est applique :
  # redemarrer la stack ne rejoue jamais une migration passee.
  # Meme regle que la CI : une migration qui casse bloque le demarrage.
  migrate:
    image: postgres:16-alpine
    volumes:
      - ../db/migrations:/migrations:ro
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Application des migrations..."
        psql -h db -U computeshare -d computeshare -c "CREATE TABLE IF NOT EXISTS migrations_applied (name TEXT PRIMARY KEY, at TIMESTAMPTZ NOT NULL DEFAULT now())" >/dev/null
        # Base pre-existante (deploy initial avant le registre) :
        # marquer 001-007 comme appliquees selon la presence de leurs objets.
        psql -h db -U computeshare -d computeshare -c "INSERT INTO migrations_applied (name) SELECT '001_schema.sql' WHERE EXISTS (SELECT FROM information_schema.tables WHERE table_name='gpu_categories') ON CONFLICT DO NOTHING" >/dev/null
        psql -h db -U computeshare -d computeshare -c "INSERT INTO migrations_applied (name) SELECT '002_mvp_runtime.sql' WHERE EXISTS (SELECT FROM information_schema.tables WHERE table_name='runtime_nodes') ON CONFLICT DO NOTHING" >/dev/null
        psql -h db -U computeshare -d computeshare -c "INSERT INTO migrations_applied (name) SELECT '003_api_keys.sql' WHERE EXISTS (SELECT FROM information_schema.tables WHERE table_name='runtime_orgs') ON CONFLICT DO NOTHING" >/dev/null
        psql -h db -U computeshare -d computeshare -c "INSERT INTO migrations_applied (name) SELECT '004_objectstore_reschedule.sql' WHERE EXISTS (SELECT FROM information_schema.tables WHERE table_name='runtime_assets') ON CONFLICT DO NOTHING" >/dev/null
        psql -h db -U computeshare -d computeshare -c "INSERT INTO migrations_applied (name) SELECT '005_antifraud.sql' WHERE EXISTS (SELECT FROM information_schema.columns WHERE table_name='runtime_nodes' AND column_name='machine_fingerprint') ON CONFLICT DO NOTHING" >/dev/null
        psql -h db -U computeshare -d computeshare -c "INSERT INTO migrations_applied (name) SELECT '006_wallet.sql' WHERE EXISTS (SELECT FROM information_schema.tables WHERE table_name='runtime_ledger') ON CONFLICT DO NOTHING" >/dev/null
        psql -h db -U computeshare -d computeshare -c "INSERT INTO migrations_applied (name) SELECT '007_billing.sql' WHERE EXISTS (SELECT FROM information_schema.tables WHERE table_name='runtime_billing_events') ON CONFLICT DO NOTHING" >/dev/null
        for f in /migrations/*.sql; do
          n=$$(basename "$$f")
          if psql -h db -U computeshare -d computeshare -tA -c "SELECT 1 FROM migrations_applied WHERE name='$$n'" | grep -q 1; then
            echo "== $$n (deja appliquee)"
          else
            echo "== $$f"
            psql -h db -U computeshare -d computeshare -v ON_ERROR_STOP=1 -f "$$f"
            psql -h db -U computeshare -d computeshare -c "INSERT INTO migrations_applied (name) VALUES ('$$n') ON CONFLICT DO NOTHING" >/dev/null
          fi
        done
        echo "Migrations OK."
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../web:/srv/web:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - orchestrator
    restart: unless-stopped

volumes:
  pgdata: {}
  resultsdata: {}
  caddydata: {}
  caddyconfig: {}
